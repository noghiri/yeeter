    <h2>Yeeter's Affiliates</h2>
    <p>Yeeter is part of the ArcanaLabs Webring.  Here's the webring directory:</p>

    <dl>

    </dl>

    <p>Want to join the webring? <a href="https://twitter.com/PatchArcana">@PatchArcana</a> is the manager of this webring. Follow the instructions at <a href="https://www.arcanalabs.ca/affiliates.html">their Affiliates page</a>.</p>
  </main>

  </footer>
    <script>
    "use strict";
    (async function() {
      const qDataList = document.querySelector("dl");
      let request = await fetch("https://webring.arcanalabs.ca");
      let webring = await request.json();
      let markup = [];

      webring.forEach(item => {
      if (item.id !== "52a534c1-3356-4d5b-97c1-51289053d82f")
        markup.push(`<dt><a href="${item.url}">${item.title}</a></dt><dd>${item.description}</dd>`);
      });

      qDataList.insertAdjacentHTML("beforeend", markup.join(""))
    }());
    </script>
    </body>
  </footer>
